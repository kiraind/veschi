# Пример запуска Veschi из готового образа: только сервис приложения.
# PostgreSQL и MinIO (или другое S3-совместимое хранилище) — внешние, их адреса
# и доступы передаются переменными ниже. HTTPS даёт прокси перед контейнером
# (без HTTPS не работают камера, геопозиция и PWA).
#
# Запуск: заполните значения и выполните `docker compose -f docs/docker-compose.yml up -d`.
# При старте контейнер сам применяет миграции, создаёт бакет и первого пользователя.
# Проверка живости — GET /healthz, она уже прописана в HEALTHCHECK образа.

services:
  veschi:
    # Теги: latest — последний релиз; X.Y.Z — конкретная версия;
    # X.Y и X — последний патч/минор этой ветки. Для прода лучше закрепить X.Y.Z.
    image: ghcr.io/kiraind/veschi:latest
    restart: unless-stopped
    ports:
      # <порт на хосте>:<PORT внутри контейнера>
      - '3000:3000'
    environment:
      # ── Сервер ───────────────────────────────────────────────────────────

      # Необязательная. HTTP-порт внутри контейнера. По умолчанию 3000.
      # Если меняете, поправьте и правую часть в `ports`.
      PORT: 3000

      # Обязательная в проде. Публичный адрес приложения, как его видит браузер:
      # схема и домен, без слеша в конце. SvelteKit сверяет с ним отправку форм,
      # поэтому без него вход за HTTPS-прокси не работает. Без него и без
      # QR_BASE_URL наклейки не печатаются (QR вели бы на localhost).
      ORIGIN: https://veschi.example.com

      # Необязательная. Адрес, который печатается в QR-кодах наклеек:
      # <QR_BASE_URL>/<ID>. Удобно задать короткий домен, перенаправляющий на
      # приложение. По умолчанию равна ORIGIN. Напечатанные наклейки потом не
      # исправить, так что выбирайте адрес, который не будет меняться.
      # QR_BASE_URL: https://v.example.com

      # Необязательная. Предельный размер запроса. Должен быть больше лимита
      # файла (50 МБ). По умолчанию в образе 52M — обычно трогать не нужно.
      # BODY_SIZE_LIMIT: 52M

      # Необязательная, но нужна за прокси. Заголовок, в котором прокси передаёт
      # адрес клиента. По адресу считаются неудачные попытки входа; без
      # переменной все клиенты будут видны с адресом прокси.
      # ADDRESS_HEADER: X-Forwarded-For

      # Необязательная, только вместе с ADDRESS_HEADER=X-Forwarded-For.
      # Сколько доверенных прокси стоит перед приложением. По умолчанию 1.
      # XFF_DEPTH: 1

      # ── PostgreSQL ───────────────────────────────────────────────────────

      # Обязательная. Строка подключения:
      # postgresql://<логин>:<пароль>@<хост>:<порт>/<база>
      # Спецсимволы в пароле экранируйте URL-кодированием (@ → %40 и т. п.).
      # База должна существовать; таблицы создадут миграции при старте.
      DATABASE_URL: postgresql://veschi:CHANGE_ME@postgres.example.com:5432/veschi

      # ── MinIO / S3 (фото и PDF наклеек) ─────────────────────────────────

      # Обязательная в проде. Адрес S3 API хранилища (у MinIO обычно порт 9000),
      # со схемой. Без неё файлы хранятся в памяти и пропадают при перезапуске —
      # так можно только для разработки. Наружу MinIO выставлять не нужно:
      # файлы отдаёт само приложение.
      S3_ENDPOINT: http://minio.example.com:9000

      # Обязательные вместе с S3_ENDPOINT. Ключ доступа и секрет (в MinIO —
      # логин и пароль пользователя или созданный для приложения access key).
      S3_ACCESS_KEY: veschi
      S3_SECRET_KEY: CHANGE_ME

      # Необязательная. Бакет для файлов; создаётся при старте, если его нет
      # (ключу нужны права на это или бакет создайте заранее). По умолчанию veschi.
      S3_BUCKET: veschi

      # Необязательная. Регион S3. Для MinIO подходит значение по умолчанию us-east-1.
      # S3_REGION: us-east-1

      # ── Первый пользователь ──────────────────────────────────────────────

      # Обязательные для первого запуска (иначе войти будет некому).
      # Пользователь создаётся при старте, если пользователя с таким логином нет.
      # Перезапуск пароль существующего пользователя не меняет; сменить его
      # можно в «Настройках».
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: CHANGE_ME

      # Необязательная. Отображаемое имя. По умолчанию равно ADMIN_LOGIN.
      # ADMIN_NAME: Админ

      # Необязательная. Забыли пароль — поставьте 1 и новый ADMIN_PASSWORD,
      # перезапустите контейнер, войдите и уберите переменную: пока она стоит,
      # пароль сбрасывается и сессии завершаются при каждом старте.
      # ADMIN_RESET_PASSWORD: 1
