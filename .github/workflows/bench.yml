# Background removal models compared on sample photos, on the CPU (thread «Обработка фото»).
name: Model bench
on:
  push:
    branches: [claude/project-thread-ugh1c0-screens]
    paths: [bench/*.py, bench/*.sh, .github/workflows/bench.yml]
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ComfyUI
        run: bench/install.sh
      - name: Run the models
        run: python bench/run.py
      - name: Save the results
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add bench/results
          git commit -m "Результаты сравнения моделей" || exit 0
          git push
