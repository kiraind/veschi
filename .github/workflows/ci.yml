name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  CHECKPOINT_DISABLE: 1

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx svelte-kit sync
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veschi
          POSTGRES_PASSWORD: veschi
          POSTGRES_DB: veschi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veschi -d veschi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://veschi:veschi@localhost:5432/veschi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  docker:
    name: Docker image
    needs: [checks, integration, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The image is published only from pushes to the default branch, as `sha-<commit>`
      # and `master`; `latest` and version tags come from the Release workflow.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
      # Built once and loaded into the local daemon, so the smoke test checks
      # exactly the image that is pushed afterwards.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            veschi:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker/smoke-test.sh veschi:ci
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done

  photo-processor:
    name: Photo processor image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The image is large (PyTorch with CUDA): built only when it or the workflow changes.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" HEAD -- photo-processor src/lib/server/photos/workflows .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        if: steps.changes.outputs.changed == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - if: steps.changes.outputs.changed == 'true'
        run: docker build -t veschi-photo-processor:ci photo-processor
      - name: Smoke test
        if: steps.changes.outputs.changed == 'true'
        run: photo-processor/smoke-test.sh veschi-photo-processor:ci
      - if: steps.changes.outputs.changed == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: steps.changes.outputs.changed == 'true' && env.PUBLISH == 'true'
        run: |
          for tag in sha-${GITHUB_SHA::7} latest; do
            docker tag veschi-photo-processor:ci "ghcr.io/${{ github.repository }}-photo-processor:$tag"
            docker push "ghcr.io/${{ github.repository }}-photo-processor:$tag"
          done
